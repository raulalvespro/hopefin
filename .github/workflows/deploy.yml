name: Deploy (Cloudflare Workers)

# Publica o app no push pra main (igual ao `npm run cf:deploy`, mas automático).
# Usa o wrangler já fixado no projeto (npx) pra bater exatamente com o deploy local.
#
# Secrets necessários no GitHub (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN    - token com permissão de editar Workers (conta do HopeFin)
#   CLOUDFLARE_ACCOUNT_ID   - a6d810ffa8649cd2cd2ad45ab3cf45ca
#   VITE_SUPABASE_URL       - https://oapcjmkklzaodgpuwjsh.supabase.co
#   VITE_SUPABASE_ANON_KEY  - anon key do HopeFin (pública, embute no bundle)
#   VITE_SENTRY_DSN         - (opcional) monitoramento de erro
#   VITE_POSTHOG_KEY        - (opcional) analytics
#   VITE_POSTHOG_HOST       - (opcional) analytics

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-hopefin
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Build (Vite + PWA)
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_POSTHOG_KEY: ${{ secrets.VITE_POSTHOG_KEY }}
          VITE_POSTHOG_HOST: ${{ secrets.VITE_POSTHOG_HOST }}

      - name: Deploy no Cloudflare Workers
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
