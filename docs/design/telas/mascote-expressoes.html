<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mascote expressões</title>
<!-- Referência de design do HopeFin. Tela: "Mascote · expressões" (2160x640px). Original: canvas Telas de entrada, arquivo MascoteExpressoes.dc.html. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@700&amp;family=DM+Sans:wght@400;500&amp;display=swap">
<style>
body{margin:0}
</style>
</head>
<body>
<div style="width: 2160px; height: 640px; box-sizing: border-box; padding: 40px 60px; background: #f6f7f9; font-family: 'DM Sans', system-ui, sans-serif; color: #0f172a; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 40px">
  <svg width="0" height="0" style="position: absolute" aria-hidden="true">
    <defs>
      <g id="jb-base">
        <path d="M88 250 L22 214 L34 252 L18 286 L96 282 Z" fill="#047857"/>
        <path d="M182 372 L176 418 M176 418 L160 424 M176 418 L188 426 M226 372 L232 418 M232 418 L218 426 M232 418 L248 424" stroke="#f59e0b" stroke-width="9" stroke-linecap="round" fill="none"/>
        <ellipse cx="205" cy="262" rx="128" ry="122" fill="#10b981"/>
        <ellipse cx="220" cy="300" rx="78" ry="72" fill="#ffffff"/>
        <path d="M205 142 C204 122 206 108 204 94" stroke="#047857" stroke-width="7" stroke-linecap="round" fill="none"/>
        <path d="M204 102 C178 100 160 82 164 62 C186 62 202 80 204 102 Z" fill="#a7f3d0"/>
        <path d="M205 98 C224 88 244 72 248 50 C226 48 208 66 205 98 Z" fill="#34d399"/>
        <circle cx="150" cy="262" r="13" fill="#fbbf24" opacity=".45"/>
        <circle cx="268" cy="262" r="13" fill="#fbbf24" opacity=".45"/>
      </g>
    </defs>
  </svg>

  <div style="background: #ffffff; border: 1px solid rgba(15,23,42,.07); border-radius: 28px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px">
    <svg width="340" height="374" viewBox="0 0 400 440" role="img" aria-label="Mascote feliz">
      <use href="#jb-base"/>
      <path d="M156 232 Q172 214 188 232 M230 232 Q246 214 262 232" stroke="#0f172a" stroke-width="8" fill="none" stroke-linecap="round"/>
      <path d="M192 248 L238 254 L204 262 Z M204 266 L230 262 L206 280 Z" fill="#f59e0b"/>
      <ellipse cx="128" cy="292" rx="42" ry="62" transform="rotate(18 128 292)" fill="#059669"/>
    </svg>
    <b style="font-family: 'Syne', sans-serif; font-size: 26px">Feliz</b>
    <span style="font-size: 17px; color: #475569">boas-vindas, perfil, posts</span>
  </div>

  <div style="background: #ffffff; border: 1px solid rgba(15,23,42,.07); border-radius: 28px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px">
    <svg width="340" height="374" viewBox="0 0 400 440" role="img" aria-label="Mascote anotando no celular">
      <use href="#jb-base"/>
      <circle cx="172" cy="228" r="22" fill="#ffffff"/><circle cx="246" cy="228" r="22" fill="#ffffff"/>
      <circle cx="178" cy="238" r="11" fill="#0f172a"/><circle cx="252" cy="238" r="11" fill="#0f172a"/>
      <circle cx="181" cy="234" r="4" fill="#ffffff"/><circle cx="255" cy="234" r="4" fill="#ffffff"/>
      <path d="M194 252 L234 258 L204 272 Z" fill="#f59e0b"/>
      <g transform="rotate(12 275 320)">
        <rect x="245" y="270" width="64" height="104" rx="12" fill="#0f172a"/>
        <rect x="252" y="280" width="50" height="80" rx="6" fill="#ecfdf5"/>
        <path d="M264 320 L274 330 L292 308" stroke="#047857" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <ellipse cx="190" cy="318" rx="40" ry="58" transform="rotate(-48 190 318)" fill="#059669"/>
    </svg>
    <b style="font-family: 'Syne', sans-serif; font-size: 26px">Anotando</b>
    <span style="font-size: 17px; color: #475569">lançamento recebido, "anotado!"</span>
  </div>

  <div style="background: #ffffff; border: 1px solid rgba(15,23,42,.07); border-radius: 28px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px">
    <svg width="340" height="374" viewBox="0 0 400 440" role="img" aria-label="Mascote comemorando">
      <g fill="#fbbf24"><circle cx="60" cy="90" r="9"/><circle cx="340" cy="120" r="7"/><rect x="300" y="50" width="14" height="14" rx="3" transform="rotate(20 307 57)"/></g>
      <g fill="#34d399"><rect x="90" y="40" width="12" height="12" rx="3" transform="rotate(-15 96 46)"/><circle cx="350" cy="200" r="8"/></g>
      <circle cx="40" cy="170" r="6" fill="#60a5fa"/>
      <ellipse cx="100" cy="190" rx="40" ry="66" transform="rotate(-40 100 190)" fill="#059669"/>
      <ellipse cx="316" cy="190" rx="40" ry="66" transform="rotate(40 316 190)" fill="#059669"/>
      <use href="#jb-base"/>
      <path d="M156 232 Q172 214 188 232 M230 232 Q246 214 262 232" stroke="#0f172a" stroke-width="8" fill="none" stroke-linecap="round"/>
      <path d="M190 246 L240 252 L204 260 Z M202 266 L234 260 L206 290 Z" fill="#f59e0b"/>
    </svg>
    <b style="font-family: 'Syne', sans-serif; font-size: 26px">Comemorando</b>
    <span style="font-size: 17px; color: #475569">conta paga, mês no azul</span>
  </div>

  <div style="background: #ffffff; border: 1px solid rgba(15,23,42,.07); border-radius: 28px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px">
    <svg width="340" height="374" viewBox="0 0 400 440" role="img" aria-label="Mascote preocupado segurando uma conta">
      <use href="#jb-base"/>
      <path d="M152 206 L188 196 M232 196 L268 206" stroke="#0f172a" stroke-width="7" stroke-linecap="round"/>
      <circle cx="172" cy="230" r="20" fill="#ffffff"/><circle cx="246" cy="230" r="20" fill="#ffffff"/>
      <circle cx="174" cy="232" r="8" fill="#0f172a"/><circle cx="248" cy="232" r="8" fill="#0f172a"/>
      <path d="M196 254 L232 258 L206 268 Z" fill="#f59e0b"/>
      <path d="M318 150 C308 168 308 180 318 184 C328 180 328 168 318 150 Z" fill="#60a5fa"/>
      <g transform="rotate(-8 280 320)">
        <rect x="238" y="276" width="86" height="110" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="4"/>
        <rect x="252" y="294" width="56" height="8" rx="4" fill="#cbd5e1"/>
        <rect x="252" y="312" width="40" height="8" rx="4" fill="#cbd5e1"/>
        <text x="281" y="362" text-anchor="middle" font-family="Syne, sans-serif" font-weight="700" font-size="24" fill="#b91c1c">R$</text>
      </g>
      <ellipse cx="196" cy="320" rx="40" ry="58" transform="rotate(-50 196 320)" fill="#059669"/>
    </svg>
    <b style="font-family: 'Syne', sans-serif; font-size: 26px">Preocupado</b>
    <span style="font-size: 17px; color: #475569">conta vencendo, aviso de limite</span>
  </div>
</div>
</body>
</html>
