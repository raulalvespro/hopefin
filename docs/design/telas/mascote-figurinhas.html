<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mascote figurinhas do WhatsApp</title>
<!-- Referência de design do HopeFin. Tela: "Mascote · figurinhas do WhatsApp" (1100x1100px). Original: canvas Telas de entrada, arquivo MascoteFigurinhas.dc.html. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@700&amp;family=DM+Sans:wght@400;500&amp;display=swap">
<style>
body{margin:0}
</style>
</head>
<body>
<div style="width: 1100px; height: 1100px; box-sizing: border-box; padding: 40px; background: #e2e8f0; font-family: 'DM Sans', system-ui, sans-serif; color: #0f172a; display: grid; grid-template-columns: repeat(2, 500px); grid-template-rows: repeat(2, 500px); gap: 20px">
  <svg width="0" height="0" style="position: absolute" aria-hidden="true">
    <defs>
      <g id="fg-base">
        <ellipse cx="205" cy="262" rx="146" ry="140" fill="#ffffff"/>
        <path d="M88 250 L22 214 L34 252 L18 286 L96 282 Z" fill="#047857" stroke="#ffffff" stroke-width="14" stroke-linejoin="round"/>
        <path d="M182 372 L176 418 M176 418 L160 424 M176 418 L188 426 M226 372 L232 418 M232 418 L218 426 M232 418 L248 424" stroke="#f59e0b" stroke-width="9" stroke-linecap="round" fill="none"/>
        <ellipse cx="205" cy="262" rx="128" ry="122" fill="#10b981"/>
        <ellipse cx="220" cy="300" rx="78" ry="72" fill="#ffffff"/>
        <path d="M205 142 C204 122 206 108 204 94" stroke="#047857" stroke-width="7" stroke-linecap="round" fill="none"/>
        <path d="M204 102 C178 100 160 82 164 62 C186 62 202 80 204 102 Z" fill="#a7f3d0" stroke="#ffffff" stroke-width="6"/>
        <path d="M205 98 C224 88 244 72 248 50 C226 48 208 66 205 98 Z" fill="#34d399" stroke="#ffffff" stroke-width="6"/>
        <circle cx="150" cy="262" r="13" fill="#fbbf24" opacity=".45"/>
        <circle cx="268" cy="262" r="13" fill="#fbbf24" opacity=".45"/>
      </g>
    </defs>
  </svg>

  <div style="position: relative; display: flex; align-items: center; justify-content: center">
    <svg width="420" height="462" viewBox="0 0 400 440" role="img" aria-label="Figurinha anotado">
      <use href="#fg-base"/>
      <circle cx="172" cy="228" r="22" fill="#ffffff"/><circle cx="246" cy="228" r="22" fill="#ffffff"/>
      <circle cx="176" cy="231" r="11" fill="#0f172a"/><circle cx="250" cy="231" r="11" fill="#0f172a"/>
      <path d="M192 250 L236 256 L204 276 Z" fill="#f59e0b"/>
      <ellipse cx="128" cy="292" rx="42" ry="62" transform="rotate(18 128 292)" fill="#059669"/>
      <circle cx="330" cy="120" r="44" fill="#10b981" stroke="#ffffff" stroke-width="10"/>
      <path d="M310 120 L325 135 L352 106" stroke="#ffffff" stroke-width="12" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <span style="position: absolute; bottom: 26px; transform: rotate(-4deg); background: #0f172a; color: #ffffff; font-family: 'Syne', system-ui, sans-serif; font-weight: 700; font-size: 44px; padding: 10px 26px; border-radius: 24px; border: 6px solid #ffffff">Anotado!</span>
  </div>

  <div style="position: relative; display: flex; align-items: center; justify-content: center">
    <svg width="420" height="462" viewBox="0 0 400 440" role="img" aria-label="Figurinha conta paga">
      <use href="#fg-base"/>
      <path d="M156 232 Q172 214 188 232 M230 232 Q246 214 262 232" stroke="#0f172a" stroke-width="8" fill="none" stroke-linecap="round"/>
      <path d="M192 248 L238 254 L204 262 Z M204 266 L230 262 L206 280 Z" fill="#f59e0b"/>
      <ellipse cx="128" cy="292" rx="42" ry="62" transform="rotate(18 128 292)" fill="#059669"/>
      <g transform="rotate(14 320 130)">
        <rect x="262" y="96" width="120" height="64" rx="14" fill="#ffffff" stroke="#047857" stroke-width="8"/>
        <text x="322" y="140" text-anchor="middle" font-family="Syne, sans-serif" font-weight="700" font-size="30" fill="#047857">PAGO</text>
      </g>
    </svg>
    <span style="position: absolute; bottom: 26px; transform: rotate(3deg); background: #10b981; color: #06281e; font-family: 'Syne', system-ui, sans-serif; font-weight: 700; font-size: 44px; padding: 10px 26px; border-radius: 24px; border: 6px solid #ffffff">Conta paga!</span>
  </div>

  <div style="position: relative; display: flex; align-items: center; justify-content: center">
    <svg width="420" height="462" viewBox="0 0 400 440" role="img" aria-label="Figurinha mês no azul">
      <g fill="#fbbf24"><circle cx="60" cy="90" r="10"/><circle cx="344" cy="110" r="8"/><rect x="300" y="44" width="16" height="16" rx="3" transform="rotate(20 308 52)"/></g>
      <g fill="#34d399"><rect x="88" y="36" width="14" height="14" rx="3" transform="rotate(-15 95 43)"/><circle cx="356" cy="196" r="9"/></g>
      <ellipse cx="100" cy="190" rx="40" ry="66" transform="rotate(-40 100 190)" fill="#059669" stroke="#ffffff" stroke-width="10"/>
      <ellipse cx="316" cy="190" rx="40" ry="66" transform="rotate(40 316 190)" fill="#059669" stroke="#ffffff" stroke-width="10"/>
      <use href="#fg-base"/>
      <path d="M156 232 Q172 214 188 232 M230 232 Q246 214 262 232" stroke="#0f172a" stroke-width="8" fill="none" stroke-linecap="round"/>
      <path d="M190 246 L240 252 L204 260 Z M202 266 L234 260 L206 290 Z" fill="#f59e0b"/>
    </svg>
    <span style="position: absolute; bottom: 26px; transform: rotate(-3deg); background: #fbbf24; color: #0f172a; font-family: 'Syne', system-ui, sans-serif; font-weight: 700; font-size: 44px; padding: 10px 26px; border-radius: 24px; border: 6px solid #ffffff">Mês no azul!</span>
  </div>

  <div style="position: relative; display: flex; align-items: center; justify-content: center">
    <svg width="420" height="462" viewBox="0 0 400 440" role="img" aria-label="Figurinha vence amanhã">
      <use href="#fg-base"/>
      <path d="M152 206 L188 196 M232 196 L268 206" stroke="#0f172a" stroke-width="7" stroke-linecap="round"/>
      <circle cx="172" cy="230" r="20" fill="#ffffff"/><circle cx="246" cy="230" r="20" fill="#ffffff"/>
      <circle cx="174" cy="232" r="8" fill="#0f172a"/><circle cx="248" cy="232" r="8" fill="#0f172a"/>
      <path d="M196 254 L232 258 L206 268 Z" fill="#f59e0b"/>
      <path d="M318 150 C308 168 308 180 318 184 C328 180 328 168 318 150 Z" fill="#60a5fa" stroke="#ffffff" stroke-width="5"/>
      <ellipse cx="128" cy="292" rx="42" ry="62" transform="rotate(18 128 292)" fill="#059669"/>
    </svg>
    <span style="position: absolute; bottom: 26px; transform: rotate(2deg); background: #ffffff; color: #92400e; font-family: 'Syne', system-ui, sans-serif; font-weight: 700; font-size: 40px; padding: 10px 26px; border-radius: 24px; border: 6px solid #fbbf24">Opa, vence amanhã</span>
  </div>
</div>
</body>
</html>
