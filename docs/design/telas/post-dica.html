<title>Post dica da casa</title>
<!-- Referência de design do HopeFin. Tela: "Post · dica da casa" (1080x1350px). Original: canvas Telas de entrada, arquivo PostDica.dc.html. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@700&amp;family=DM+Sans:wght@400;500&amp;display=swap">

body{margin:0}

<body>
<div style="width: 1080px; height: 1350px; box-sizing: border-box; padding: 88px; background: #10b981; font-family: 'DM Sans', system-ui, sans-serif; color: #0f172a; display: flex; flex-direction: column; justify-content: center">
  <div style="background: #ffffff; border-radius: 48px; padding: 72px 64px; display: flex; flex-direction: column; gap: 36px; box-shadow: 0 18px 40px rgba(6,40,30,.18)">
    <div style="display: flex; align-items: center; justify-content: space-between">

    </div>
    <p style="margin: 0; font-family: 'Syne', system-ui, sans-serif; font-weight: 700; font-size: 76px; line-height: 82px">Conta que vence amanhã não deveria ser surpresa.</p>
    <p style="margin: 0; font-size: 32px; line-height: 44px; color: #475569">Cadastre as contas fixas uma vez. O HopeFin avisa a família antes de vencer.</p>
    <div style="height: 2px; background: rgba(15,23,42,.07)"></div>
    <div style="display: flex; align-items: center; gap: 16px">
      <svg width="56" height="56" viewBox="0 0 512 512" aria-hidden="true"><rect x="8" y="8" width="496" height="496" rx="108" fill="#ffffff" stroke="#10b981" stroke-width="16"/><g fill="#10b981"><rect x="150" y="146" width="58" height="220" rx="18"/><rect x="304" y="146" width="58" height="220" rx="18"/></g><path d="M190 300 L322 222" fill="none" stroke="#10b981" stroke-width="54" stroke-linecap="round"/></svg>
      <span style="font-size: 26px; font-weight: 500">@hopefinapp</span>
      <span style="margin-left: auto; font-size: 24px; color: #475569">Salve para lembrar</span>
    </div>
  </div>
