<style>

<body>
<div style="position: relative; width: 1640px; height: 624px; overflow: hidden; background: #f6f7f9; font-family: 'DM Sans', system-ui, sans-serif; color: #0f172a">
  <div style="position: absolute; left: 290px; top: 0; width: 500px; height: 624px; display: flex; flex-direction: column; justify-content: center; gap: 22px">
    <div style="display: flex; align-items: center; gap: 14px">
      <svg width="56" height="56" viewBox="0 0 512 512" aria-hidden="true"><rect x="8" y="8" width="496" height="496" rx="108" fill="#ffffff" stroke="#10b981" stroke-width="16"/><g fill="#10b981"><rect x="150" y="146" width="58" height="220" rx="18"/><rect x="304" y="146" width="58" height="220" rx="18"/></g><path d="M190 300 L322 222" fill="none" stroke="#10b981" stroke-width="54" stroke-linecap="round"/></svg>
      <span style="font-family: 'Syne', system-ui, sans-serif; font-weight: 700; font-size: 38px">hope<span style="color: #047857">fin</span></span>

    <h1 style="margin: 0; font-family: 'Syne', system-ui, sans-serif; font-weight: 700; font-size: 62px; line-height: 66px">Sua casa em ordem. Suas finanças também.</h1>

      <span style="font-family: 'Syne', sans-serif; font-weight: 700; font-size: 48px">R$ 2.418,30</span>

    </div>
    <div style="background: #ffffff; border: 1px solid rgba(15,23,42,.07); border-radius: 20px; padding: 6px 24px">
