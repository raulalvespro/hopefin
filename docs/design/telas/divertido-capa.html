<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Capa estilo Divertido</title>
<!-- Referência de design do HopeFin. Tela: "Estilo 5 · Divertido · capa" (1640x624px). Original: canvas Telas de entrada, arquivo DivertidoCapa.dc.html. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@700&amp;family=DM+Sans:wght@400;500&amp;display=swap">
<style>
body{margin:0}
</style>
</head>
<body>
<div style="position: relative; width: 1640px; height: 624px; overflow: hidden; background: #fbbf24; font-family: 'DM Sans', system-ui, sans-serif; color: #0f172a">
  <div style="position: absolute; left: 300px; top: 70px; transform: rotate(-4deg); background: #ffffff; border-radius: 28px; padding: 26px 34px; font-family: 'Syne', system-ui, sans-serif; font-weight: 700; font-size: 44px; box-shadow: 0 6px 0 #0f172a">Quem pagou a luz?</div>
  <div style="position: absolute; left: 360px; top: 230px; transform: rotate(3deg); background: #10b981; color: #06281e; border-radius: 28px; padding: 26px 34px; font-family: 'Syne', system-ui, sans-serif; font-weight: 700; font-size: 44px; box-shadow: 0 6px 0 #0f172a">O cartão fechou em quanto?</div>
  <div style="position: absolute; left: 310px; top: 400px; transform: rotate(-2deg); background: #0f172a; color: #ffffff; border-radius: 28px; padding: 26px 34px; font-family: 'Syne', system-ui, sans-serif; font-weight: 700; font-size: 44px; box-shadow: 0 6px 0 #047857">Sobrou o quê?</div>
  <div style="position: absolute; left: 1010px; top: 0; width: 370px; height: 624px; display: flex; flex-direction: column; justify-content: center; gap: 16px">
    <p style="margin: 0; font-family: 'Syne', system-ui, sans-serif; font-weight: 700; font-size: 64px; line-height: 66px">O HopeFin responde.</p>
    <p style="margin: 0; font-size: 26px; line-height: 34px; font-weight: 500">A família manda no WhatsApp. O mês aparece no app.</p>
  </div>
</div>
</body>
