<title>Carrossel slide 2</title>
<!-- Referência de design do HopeFin. Tela: "Carrossel · slide de conteúdo 1" (1080x1350px). Original: canvas Telas de entrada, arquivo CarrosselSlide2.dc.html. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@700&amp;family=DM+Sans:wght@400;500&amp;display=swap">
<style>
body{margin:0}
</style>
</head>
<body>
<div style="width: 1080px; height: 1350px; box-sizing: border-box; padding: 88px; background: #f6f7f9; font-family: 'DM Sans', system-ui, sans-serif; color: #0f172a; display: flex; flex-direction: column; justify-content: space-between">
  <div style="display: flex; justify-content: space-between; align-items: center">
    <span style="font-family: 'Syne', system-ui, sans-serif; font-weight: 700; font-size: 160px; line-height: 1; color: #10b981">1</span>
    <span style="font-size: 26px; color: #475569">2 / 7</span>
  </div>
  <div style="display: flex; flex-direction: column; gap: 28px">
    <h2 style="margin: 0; font-family: 'Syne', system-ui, sans-serif; font-weight: 700; font-size: 88px; line-height: 92px">Delivery da semana</h2>
    <p style="margin: 0; font-size: 36px; line-height: 50px; color: #475569">Um pedido aqui, outro ali. Ninguém sente na hora, mas no fim do mês vira uma conta inteira.</p>
  </div>
  <div style="background: #ffffff; border: 1px solid rgba(15,23,42,.07); border-radius: 28px; padding: 32px 36px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 1px 2px rgba(15,23,42,.04), 0 1px 3px rgba(15,23,42,.06)">
    <span style="font-size: 24px; color: #475569">Exemplo</span>
    <div style="display: flex; justify-content: space-between; align-items: baseline; font-size: 32px"><span>4 pedidos × R$ 45</span><b style="font-family: 'Syne', sans-serif; font-size: 44px; color: #b91c1c">R$ 180 no mês</b></div>
  </div>
  <div style="display: flex; align-items: center; justify-content: space-between">
    <span style="font-size: 26px; font-weight: 500; color: #475569">@hopefinapp</span>
    <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#047857" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
  </div>
</div>
