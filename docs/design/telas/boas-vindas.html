<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boas-vindas HopeFin</title>
<!-- Referência de design do HopeFin. Tela: "Boas-vindas · celular" (390x844px). Original: canvas Telas de entrada, arquivo BoasVindas.dc.html. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700&amp;family=DM+Sans:wght@400;500&amp;display=swap">
<style>
body{margin:0}
@keyframes hf-check{0%{stroke-dashoffset:24}100%{stroke-dashoffset:0}}
@keyframes hf-fill{0%{width:0}100%{width:33%}}
@keyframes hf-fade{0%{opacity:0;transform:translateY(10px)}100%{opacity:1;transform:translateY(0)}}
@keyframes hf-coin{0%{transform:translateY(-40px);opacity:0}30%{opacity:1}70%{transform:translateY(0);opacity:1}100%{transform:translateY(0);opacity:0}}
.hf-check{stroke-dasharray:24;animation:hf-check .5s ease-out both}
.hf-fill{animation:hf-fill 1.2s ease-out both .6s}
.hf-in{animation:hf-fade .5s ease-out both}
.hf-coin{animation:hf-coin 2.8s ease-in infinite}
@media (prefers-reduced-motion: reduce){.hf-check,.hf-fill,.hf-in,.hf-coin{animation:none}}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 56px 24px 32px; display: flex; flex-direction: column; gap: 24px; font-family: 'DM Sans', system-ui, sans-serif; color: #0f172a; background: #f6f7f9">
  <div style="display: flex; justify-content: center">
    <svg width="220" height="170" viewBox="0 0 220 170" aria-hidden="true">
      <circle class="hf-coin" cx="110" cy="30" r="14" fill="#fbbf24" style="animation-delay: 0s"/>
      <circle class="hf-coin" cx="88" cy="40" r="11" fill="#10b981" style="animation-delay: .9s"/>
      <circle class="hf-coin" cx="132" cy="42" r="11" fill="#10b981" style="animation-delay: 1.8s"/>
      <rect x="40" y="70" width="140" height="90" rx="24" fill="#10b981"/>
      <rect x="86" y="64" width="48" height="12" rx="6" fill="#0f172a"/>
      <path d="M78 128 L104 108 L124 118 L150 96" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>
  <div class="hf-in" style="display: flex; flex-direction: column; gap: 8px; text-align: center">
    <h1 style="margin: 0; font-family: 'Syne', system-ui, sans-serif; font-weight: 700; font-size: 26px; line-height: 30px">Bem-vindo ao HopeFin</h1>
    <p style="margin: 0; font-size: 15px; line-height: 22px; color: #475569">Três passos e o mês da sua casa já aparece organizado.</p>
  </div>
  <div style="display: flex; flex-direction: column; gap: 8px">
    <div style="display: flex; justify-content: space-between; font-size: 13px; color: #475569"><span>Comece por aqui</span><span>1 de 3</span></div>
    <div style="height: 8px; border-radius: 8px; background: #e2e8f0; overflow: hidden"><div class="hf-fill" style="height: 100%; width: 33%; background: #10b981; border-radius: 8px"></div></div>
  </div>
  <ol style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 12px">
    <li class="hf-in" style="display: flex; align-items: center; gap: 14px; background: #ffffff; border: 1px solid rgba(15,23,42,.07); border-radius: 12px; padding: 16px; animation-delay: .2s">
      <svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><circle cx="14" cy="14" r="14" fill="#10b981"/><path class="hf-check" d="M8 14.5 L12.5 19 L20 10" fill="none" stroke="#06281e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="animation-delay: .7s"/></svg>
      <div style="display: flex; flex-direction: column; gap: 2px; flex: 1"><span style="font-weight: 500; font-size: 15px">Cadastrar sua renda</span><span style="font-size: 13px; color: #047857">Feito</span></div>
    </li>
    <li class="hf-in" style="display: flex; align-items: center; gap: 14px; background: #ffffff; border: 1px solid rgba(15,23,42,.07); border-radius: 12px; padding: 16px; animation-delay: .35s">
      <svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><circle cx="14" cy="14" r="13" fill="none" stroke="#94a3b8" stroke-width="2"/></svg>
      <div style="display: flex; flex-direction: column; gap: 2px; flex: 1"><span style="font-weight: 500; font-size: 15px">Adicionar um cartão</span><span style="font-size: 13px; color: #475569">Para ver a fatura antes de fechar</span></div>
      <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6 L15 12 L9 18" fill="none" stroke="#475569" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </li>
    <li class="hf-in" style="display: flex; align-items: center; gap: 14px; background: #ffffff; border: 1px solid rgba(15,23,42,.07); border-radius: 12px; padding: 16px; animation-delay: .5s">
      <svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><circle cx="14" cy="14" r="13" fill="none" stroke="#94a3b8" stroke-width="2"/></svg>
      <div style="display: flex; flex-direction: column; gap: 2px; flex: 1"><span style="font-weight: 500; font-size: 15px">Lançar uma conta fixa</span><span style="font-size: 13px; color: #475569">Aluguel, luz, internet, escola</span></div>
      <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6 L15 12 L9 18" fill="none" stroke="#475569" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </li>
  </ol>
  <div style="margin-top: auto; display: flex; flex-direction: column; gap: 10px">
    <button type="button" style="min-height: 48px; background: #10b981; color: #06281e; font-family: 'Syne', system-ui, sans-serif; font-weight: 700; font-size: 16px; letter-spacing: .02em; border: none; border-radius: 8px; cursor: pointer">Adicionar cartão</button>
    <button type="button" style="min-height: 44px; background: none; color: #475569; font: inherit; font-size: 15px; border: 1px solid rgba(15,23,42,.12); border-radius: 8px; cursor: pointer">Convidar alguém da família</button>
  </div>
</div>
</body>
</html>
