<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Capa Facebook HopeFin</title>
<!-- Referência de design do HopeFin. Tela: "Capa da página do Facebook" (1640x624px). Original: canvas Telas de entrada, arquivo CapaFacebook.dc.html. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@700&amp;family=DM+Sans:wght@400;500&amp;display=swap">
<style>
body{margin:0}
</style>
</head>
<body>
<div style="position: relative; width: 1640px; height: 624px; overflow: hidden; background: #10b981; font-family: 'DM Sans', system-ui, sans-serif; color: #06281e">
  <svg width="300" height="624" viewBox="0 0 300 624" aria-hidden="true" style="position: absolute; right: 0; bottom: 0">
    <rect x="20" y="404" width="56" height="220" rx="28" fill="#ffffff" fill-opacity=".22"/>
    <rect x="100" y="304" width="56" height="320" rx="28" fill="#ffffff" fill-opacity=".36"/>
    <rect x="180" y="194" width="56" height="430" rx="28" fill="#ffffff" fill-opacity=".52"/>
    <circle cx="208" cy="140" r="22" fill="#fbbf24"/>
  </svg>
  <svg width="220" height="624" viewBox="0 0 220 624" aria-hidden="true" style="position: absolute; left: 0; top: 0">
    <rect x="-28" y="-40" width="56" height="260" rx="28" fill="#ffffff" fill-opacity=".16"/>
    <rect x="52" y="-40" width="56" height="180" rx="28" fill="#ffffff" fill-opacity=".1"/>
  </svg>
  <div style="position: absolute; left: 290px; top: 0; width: 1060px; height: 624px; box-sizing: border-box; padding: 0 0 40px; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 24px; text-align: center">
    <h1 style="margin: 0; font-family: 'Syne', system-ui, sans-serif; font-weight: 700; font-size: 76px; line-height: 80px; letter-spacing: -0.01em">Sua casa em ordem.<br>Suas finanças também.</h1>
    <p style="margin: 0; font-size: 32px; line-height: 42px; font-weight: 500">Lance pelo WhatsApp. A família toda vê o mês no app.</p>
    <span style="margin-top: 4px; padding: 10px 22px; border-radius: 28px; background: #06281e; color: #ffffff; font-size: 24px; font-weight: 500">hopefin.com.br · 7 dias grátis</span>
  </div>
</div>
</body>
</html>
